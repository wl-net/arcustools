[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "arcushub"
version = "0.1.0"
description = "Arcus hub management tools"
requires-python = ">=3.9"
dependencies = [
    "click",
    "paramiko",
]

[tool.setuptools.packages.find]
include = ["arcushub*"]

[project.scripts]
arcushub = "arcushub.cli:cli"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade (pinned to 3.9 by target-version)
select = ["E", "W", "F", "I", "B", "UP"]
